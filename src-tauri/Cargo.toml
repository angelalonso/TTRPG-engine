[package]
name = "gtr2-racewars"
version = "0.1.0"
description = "Sim Racing Manager Tauri v2 Application"
authors = ["you"]
edition = "2021"

[lib]
# `cdylib` is required for desktop bundling and Android target
# `staticlib` is required for iOS target
# `rlib` is required for local Rust testing/benchmarking
name = "gtr2_racewars_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10.2"
csv = "1.4.0"
