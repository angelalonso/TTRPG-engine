[package]
name = "sim-racing-manager"
version = "0.1.0"
description = "Sim Racing Manager Tauri v2 Application"
authors = ["you"]
edition = "2021"

[lib]
# `cdylib` is required for desktop bundling and Android target
# `staticlib` is required for iOS target
# `rlib` is required for local Rust testing/benchmarking
name = "sim_racing_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
