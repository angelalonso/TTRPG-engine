<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OMP First-S Race Boots</title>
    <link rel="stylesheet" href="./gtr-theme.css" />
    <link rel="stylesheet" href="./gtr-card.css" />
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img src="../img/omp_first_s.jpeg" alt="OMP First-S Race Boots" />
          </div>
        </div>
      </main>
      <aside class="catalog-side">
        <h1>OMP First-S Race Boots</h1>
        <p>
          These racing boots are FIA-approved! Yeah...THAT FIA! Anyway, they are actually good boots and they don't cost a kidney.
        </p>
        <section class="catalog-details">
          <h2>EQUIPMENT DETAILS</h2>
          <ul>
            <li>
              <span class="catalog-label">PRICE</span>
              <span class="catalog-value">£190</span>
            </li>
            <li>
              <span class="catalog-label">VALID FOR</span>
              <span class="catalog-value">1,200 days</span>
            </li>
            <li>
              <span class="catalog-label">PADDOCK CREDIBILITY</span>
              <span class="catalog-value">+1</span>
            </li>
          </ul>
        </section>
      </aside>
    </div>
  </body>
</html>
