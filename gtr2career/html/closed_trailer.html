<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Closed Trailer</title>
    <link rel="stylesheet" href="./gtr-theme.css" />
    <link rel="stylesheet" href="./gtr-card.css" />
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img src="../img/trailer_closed.jpeg" alt="Closed Trailer" />
          </div>
        </div>
      </main>
      <aside class="catalog-side">
        <h1>Closed Trailer</h1>
        <p>This trailer shouts "I am getting there, mate, getting there!". Most small, semi-pro cars will fit here, but don't expect to organize RedBull-level parties under its hood.</p>
        <section class="catalog-details">
          <h2>TRAILER DETAILS</h2>
          <ul>
            <li>
              <span class="catalog-label">PRICE</span>
              <span class="catalog-value">£25,000</span>
            </li>
            <li>
              <span class="catalog-label">VALID FOR</span>
              <span class="catalog-value">Cup Cars, including bigger hot hatches</span>
            </li>
          </ul>
        </section>
      </aside>
    </div>
  </body>
</html>
