<h3>GTR2 setup</h3>
<p>Start GTR2 and select <strong>FIA N-GT Championship - Round 9: Barcelona</strong>.</p>
<p>Use the event track and configure the required car/equipment: <strong>porsche_911_rs, porsche_911_rsr, ferrari_360, helmet</strong>.</p>
<p>Run the event, then continue to import or enter the results in the engine.</p>
