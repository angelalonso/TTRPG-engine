<h3>GTR2 setup</h3>
<p>Start GTR2 and select <strong>Amateur Championship - Round 7: Croft</strong>.</p>
<p>Use the event track and configure the required car/equipment: <strong>scirocco, ford_fiesta_st150, honda_civic, 500_abarth, helmet</strong>.</p>
<p>Run the event, then continue to import or enter the results in the engine.</p>
