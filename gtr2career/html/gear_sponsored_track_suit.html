<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sponsored Track Suit</title>
    <link rel="stylesheet" href="./gtr-theme.css" />
    <link rel="stylesheet" href="./gtr-card.css" />
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img
              src="../img/sponsored_track_suit.jpeg"
              alt="Sponsored Track Suit"
            />
          </div>
        </div>
      </main>
      <aside class="catalog-side">
        <h1>Sponsored Track Suit</h1>
        <p>
          A comfy tracksuit that you can sweat over and wash without much hassle. It's fire-retardant too!
        </p>
        <section class="catalog-details">
          <h2>EQUIPMENT DETAILS</h2>
          <ul>
            <li>
              <span class="catalog-label">PRICE</span>
              <span class="catalog-value">£900</span>
            </li>
            <li>
              <span class="catalog-label">VALID FOR</span>
              <span class="catalog-value">1,500 days</span>
            </li>
            <li>
              <span class="catalog-label">PADDOCK CREDIBILITY</span>
              <span class="catalog-value">+1</span>
            </li>
          </ul>
        </section>
      </aside>
    </div>
  </body>
</html>
