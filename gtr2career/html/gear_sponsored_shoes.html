<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sponsored Shoes</title>
    <link rel="stylesheet" href="./gtr-theme.css" />
    <link rel="stylesheet" href="./gtr-card.css" />
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img src="../img/sponsored_shoes.jpeg" alt="Sponsored Shoes" />
          </div>
        </div>
      </main>
      <aside class="catalog-side">
        <h1>Sponsored Shoes</h1>
        <p>
          This item satisfies the configured equipment requirement. Any race
          boots qualifies, including this item and other compatible versions.
          Configured lifespan: 2,000 days.
        </p>
        <section class="catalog-details">
          <h2>EQUIPMENT DETAILS</h2>
          <ul>
            <li>
              <span class="catalog-label">PRICE</span>
              <span class="catalog-value">£600</span>
            </li>
            <li>
              <span class="catalog-label">VALID FOR</span>
              <span class="catalog-value">2,000 days</span>
            </li>
            <li>
              <span class="catalog-label">PADDOCK CREDIBILITY</span>
              <span class="catalog-value">None</span>
            </li>
          </ul>
        </section>
      </aside>
    </div>
  </body>
</html>
