<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Trailer</title>
    <link rel="stylesheet" href="./gtr-theme.css" />
    <link rel="stylesheet" href="./gtr-card.css" />
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img src="../img/trailer_open.jpeg" alt="Open Trailer" />
          </div>
        </div>
      </main>
      <aside class="catalog-side">
        <h1>Open Trailer</h1>
        <p>This trailer will be more than enough to take your track-only race car to the...track. Once you enter semi-pro races and above, you will need something bigger, though.</p>
        <section class="catalog-details">
          <h2>TRAILER DETAILS</h2>
          <ul>
            <li>
              <span class="catalog-label">PRICE</span>
              <span class="catalog-value">£5,000</span>
            </li>
            <li>
              <span class="catalog-label">VALID FOR</span>
              <span class="catalog-value">Small Hot Hatches, and light cars like Radicals, Caterhams...</span>
            </li>
          </ul>
        </section>
      </aside>
    </div>
  </body>
</html>
