<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subprime Online Loan</title>
  <link rel="stylesheet" href="./gtr-theme.css">
  <link rel="stylesheet" href="./gtr-card.css">
</head>
<body class="catalog-page">
  <div class="catalog-container">
    <main class="catalog-card green">
      <div class="catalog-card-inner">
        <div class="catalog-image"><img src="../img/event_placeholder.svg" alt="Subprime Online Loan"></div>
        <section class="catalog-details">
          <h2>VENTURE DETAILS</h2>
          <ul>
            <li><span class="catalog-label">TYPE</span> <span class="catalog-value">VENTURE</span></li>
            <li><span class="catalog-label">COST</span> <span class="catalog-value">£0</span></li>
            <li><span class="catalog-label">STAMINA</span> <span class="catalog-value">10</span></li>
            <li><span class="catalog-label">PAYOUT</span> <span class="catalog-value">£17,500</span></li>
          </ul>
        </section>
      </div>
    </main>
    <aside class="catalog-side green">
      <h1>Subprime Online Loan</h1>
      <p>This venture provides an immediate advance and creates the configured repayment obligation.</p>
      <p>A current job is required. Missing a scheduled payment causes the configured loan default.</p>
    </aside>
  </div>
</body>
</html>
