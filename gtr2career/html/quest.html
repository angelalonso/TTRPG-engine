<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Championship</title>
  <link rel="stylesheet" href="./gtr-theme.css">
  <link rel="stylesheet" href="./gtr-card.css">
</head>
<body class="catalog-page">
  <div class="catalog-container">
    <main class="catalog-card gold">
      <div class="catalog-card-inner">
        <div class="catalog-image"><img src="../img/championship_placeholder.svg" alt="Championship"></div>
        <section class="catalog-details">
          <h2>ENTRY AND REWARDS</h2>
          <ul>
            <li><span class="catalog-label">ENTRY FEE</span> <span class="catalog-value">Configured in the dataset</span></li>
            <li><span class="catalog-label">REWARDS</span> <span class="catalog-value">Configured in the dataset</span></li>
          </ul>
        </section>
      </div>
    </main>
    <aside class="catalog-side gold">
      <div class="catalog-logo-row">
        <img class="catalog-logo" src="../img/organizer_180_motor_club.svg" alt="180 Motor Club logo">
        <img class="catalog-logo center" src="../img/championship_placeholder.svg" alt="Championship logo">
      </div>
      <h1>Championship</h1>
      <p>Organized by 180 Motor Club. Championship rounds and results appear here as they are produced.</p>
    </aside>
  </div>
</body>
</html>
