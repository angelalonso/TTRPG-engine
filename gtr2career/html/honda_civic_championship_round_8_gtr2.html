<h3>GTR2 setup</h3>
<p>Start GTR2 and select <strong>Honda Civic Championship - Round 8: Donington National</strong>.</p>
<p>Use the event track and configure the required car/equipment: <strong>honda_civic, helmet</strong>.</p>
<p>Run the event, then continue to import or enter the results in the engine.</p>
