<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Goodwood Festival of Speed</title>
    <link rel="stylesheet" href="./gtr-theme.css" />
    <link rel="stylesheet" href="./gtr-card.css" />
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card silver">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img
              src="../img/goodwood.png"
              alt="Goodwood Festival of Speed"
            />
          </div>
          <section class="catalog-details">
            <h2>EVENT DETAILS</h2>
            <ul>
              <li>
                <span class="catalog-label">TYPE</span>
                <span class="catalog-value">social</span>
              </li>
              <li>
                <span class="catalog-label">DURATION</span>
                <span class="catalog-value">1 day</span>
              </li>
              <li>
                <span class="catalog-label">ENTRY</span>
                <span class="catalog-value">£0</span>
              </li>
              <li>
                <span class="catalog-label">REWARD POOL</span>
                <span class="catalog-value">£0</span>
              </li>
              <li>
                <span class="catalog-label">CHARISMA</span>
                <span class="catalog-value">4</span>
              </li>
              <li>
                <span class="catalog-label">TAGS</span>
                <span class="catalog-value">social;motorsport;goodwood</span>
              </li>
            </ul>
          </section>
        </div>
      </main>
      <aside class="catalog-side silver">
        <div class="catalog-logo-row">
          <img
            class="catalog-logo"
	     src="../img/goodwood_festival.jpeg"
            alt="Goodwood Club logo"
          />
          <div>
            <h2>Goodwood Club</h2>
            <p>Organizer</p>
          </div>
        </div>
        <h1>Goodwood Festival of Speed</h1>
        <p>
          This event is probably the biggest, best known meeting in all of UK.
        </p>
      </aside>
    </div>
  </body>
</html>
