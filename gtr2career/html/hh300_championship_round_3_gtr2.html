<h3>GTR2 setup</h3>
<p>Start GTR2 and select <strong>Hot Hatch 300 Championship - Round 3: Silverstone</strong>.</p>
<p>Use the event track and configure the required car/equipment: <strong>giulietta, punto, focus, mazda3, megane, vwgolf, helmet</strong>.</p>
<p>Run the event, then continue to import or enter the results in the engine.</p>
