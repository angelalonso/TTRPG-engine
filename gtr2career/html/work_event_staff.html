<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Event staffing shift
    </title>
    <link rel="stylesheet" href="./gtr-theme.css">
    <link rel="stylesheet" href="./gtr-card.css">
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card silver">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img src="../img/work_event_staff.jpeg" alt="Event staffing shift">
          </div>
          <section class="catalog-details">
            <h2>
              JOB DETAILS
            </h2>
            <ul>
              <li>
                <span class="catalog-label">
                  TYPE
                </span>
                <span class="catalog-value">
                  work
                </span>
              </li>
              <li>
                <span class="catalog-label">
                  STAMINA TO APPLY
                </span>
                <span class="catalog-value">
                  25
                </span>
              </li>
              <li>
                <span class="catalog-label">
                  SUCCESS RATE
                </span>
                <span class="catalog-value">
                  80%
                </span>
              </li>
              <li>
                <span class="catalog-label">
                  STAMINA PER WORKDAY
                </span>
                <span class="catalog-value">
                  24
                </span>
              </li>
              <li>
                <span class="catalog-label">
                  PAYOUT
                </span>
                <span class="catalog-value">
                  £125 / once
                </span>
              </li>
            </ul>
          </section>
        </div>
      </main>
      <aside class="catalog-side silver">
        <div class="catalog-logo-row">
          <img class="catalog-logo" src="../img/work_event_staff_logo.jpeg" alt="Employer logo">
          <div>
            <h2>
              Employer
            </h2>
          </div>
        </div>
        <h1>
          Event staffing shift
        </h1>
        <p>
          Review the current Event staffing shift job details, stamina costs, and payout before committing.
        </p>
      </aside>
    </div>
  </body>
</html>
