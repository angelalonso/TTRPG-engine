<h3>GTR2 setup</h3>
<p>Start GTR2 and select <strong>Porsche Cup Championship - Round 5: Mallory Park</strong>.</p>
<p>Use the event track and configure the required car/equipment: <strong>porsche_996_cup, helmet</strong>.</p>
<p>Run the event, then continue to import or enter the results in the engine.</p>
