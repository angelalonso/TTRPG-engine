<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lower Cost Offer</title>
    <link rel="stylesheet" href="./gtr-theme.css" />
    <link rel="stylesheet" href="./gtr-card.css" />
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img src="../img/lower_cost.jpeg" alt="Lower Cost Offer" />
          </div>
          <section class="catalog-details">
            <h2>EQUIPMENT DETAILS</h2>
            <ul>
              <li>
                <span class="catalog-label">PRICE</span>
                <span class="catalog-value">£0</span>
              </li>
              <li>
                <span class="catalog-label">VALID FOR</span>
                <span class="catalog-value">Permanent</span>
              </li>
              <li>
                <span class="catalog-label">PADDOCK CREDIBILITY</span>
                <span class="catalog-value">None</span>
              </li>
            </ul>
          </section>
        </div>
      </main>
      <aside class="catalog-side">
        <h1>Lower Cost Offer</h1>
        <p>
          This item satisfies the configured equipment requirement. Any
          qualifies, including this item and other compatible versions.
        </p>
      </aside>
    </div>
  </body>
</html>
