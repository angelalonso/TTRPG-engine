<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{name}}</title>
    <link rel="stylesheet" href="./gtr-theme.css">
    <link rel="stylesheet" href="./gtr-card.css">
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card silver">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img src="../img/{{image}}" alt="{{name}}">
          </div>
          <section class="catalog-details">
            <h2>VENTURE DETAILS</h2>
            <ul>
              <li><span class="catalog-label">TYPE</span><span class="catalog-value">trade</span></li>
              <li><span class="catalog-label">STAMINA TO APPLY</span><span class="catalog-value">{{attempt_stamina}}</span></li>
              <li><span class="catalog-label">SUCCESS RATE</span><span class="catalog-value">{{success_rate}}%</span></li>
              <li><span class="catalog-label">PAYOUT</span><span class="catalog-value">£{{payout}} / {{payout_frequency}}</span></li>
            </ul>
          </section>
        </div>
      </main>
      <aside class="catalog-side silver">
        <h1>{{name}}</h1>
        <p>{{description}}</p>
      </aside>
    </div>
  </body>
</html>
