<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{name}}</title><link rel="stylesheet" href="./gtr-theme.css"><link rel="stylesheet" href="./gtr-card.css"></head><body class="catalog-page"><div class="catalog-container"><main class="catalog-card red"><div class="catalog-card-inner"><div class="catalog-image"><img src="../img/{{image}}" alt="{{name}}"></div><section class="catalog-details"><h2>EVENT DETAILS</h2><ul><li><span class="catalog-label">DATE</span><span class="catalog-value">DAY {{day}}</span></li><li><span class="catalog-label">ENTRY FEE</span><span class="catalog-value">£{{fee}}</span></li><li><span class="catalog-label">REWARD POOL</span><span class="catalog-value">£{{reward}}</span></li><li><span class="catalog-label">POSITION REWARDS</span><span class="catalog-value"><ul>{{position_rewards}}</ul></span></li></ul></section></div></main><aside class="catalog-side red"><div class="catalog-logo-row"><img class="catalog-logo" src="../img/{{organizer_image}}" alt="Organizer logo"><div><h2>Organizer</h2></div></div><h1>{{name}}</h1><p>{{description}}</p></aside></div></body></html>
