<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sparco Prime-R Racing Suit</title>
    <link rel="stylesheet" href="./gtr-theme.css" />
    <link rel="stylesheet" href="./gtr-card.css" />
  </head>
  <body class="catalog-page">
    <div class="catalog-container">
      <main class="catalog-card">
        <div class="catalog-card-inner">
          <div class="catalog-image">
            <img
              src="../img/sparco_prime_r.jpeg"
              alt="Sparco Prime-R Racing Suit"
            />
          </div>
        </div>
      </main>
      <aside class="catalog-side">
        <h1>Sparco Prime-R Racing Suit</h1>
        <p>
          The suit of all suits. Remember that F1 accident?, the one with the fireball? That driver was wearing one of these, and he still does ads for Gillette.
        </p>
        <section class="catalog-details">
          <h2>EQUIPMENT DETAILS</h2>
          <ul>
            <li>
              <span class="catalog-label">PRICE</span>
              <span class="catalog-value">£1,100</span>
            </li>
            <li>
              <span class="catalog-label">VALID FOR</span>
              <span class="catalog-value">2,500 days</span>
            </li>
            <li>
              <span class="catalog-label">PADDOCK CREDIBILITY</span>
              <span class="catalog-value">+5</span>
            </li>
          </ul>
        </section>
      </aside>
    </div>
  </body>
</html>
