  <body>
    <h1>Frostfarnblatt</h1>
    <p><em>Ein zäher Farn aus kühlen Gebirgstälern.</em></p>
    <h2>Eigenschaften</h2>
    <ul>
      <li><strong>Essenzen:</strong> Frost 2, Vital 1</li>
      <li><strong>Marktpreis:</strong> ca. 38 Kr</li>
      <li><strong>Haltbarkeit:</strong> haltbar</li>
    </ul>
    <p>Diese Zutat kann auf dem Markt gekauft und verkauft werden und wird beim Sammeln in den
    passenden Gebieten der Dornmark gefunden.</p>
