    <h1>Wolfszahn</h1>
    <p><em>Ein harter, dunkler Zahn aus den Wäldern.</em></p>
    <h2>Eigenschaften</h2>
    <ul>
      <li><strong>Essenzen:</strong> Vital 2, Schatten 1</li>
      <li><strong>Marktpreis:</strong> ca. 225 Kr</li>
      <li><strong>Haltbarkeit:</strong> haltbar</li>
    </ul>
    <p>Diese Zutat kann auf dem Markt gekauft und verkauft werden und wird beim Sammeln in den
    passenden Gebieten der Dornmark gefunden.</p>
